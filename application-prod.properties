# =====================================================================
# application-prod.properties
#
# No infra values are hardcoded here. If any required env var is missing,
# the service must fail at startup - it should never silently fall back
# to a dev resource.
# =====================================================================

# ---------------------------------------------------------------------
# SERVICE REGISTRY
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------------------------------------------------------------------
# INFRASTRUCTURE
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------
# LOGGING - quiet, without SQL binding traces
# ---------------------------------------------------------------------
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.root=${LOG_LEVEL_ROOT:INFO}

# ---------------------------------------------------------------------
# SERVER PORT
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8087}

# ---------------------------------------------------------------------
# MYSQL
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.key-id=${JWT_KEY_ID:gb-user-key-001}
jwt.issuer=${JWT_ISSUER:GB-user-service}
jwt.audience=${JWT_AUDIENCE:greatbus-api}
jwt.access-token.expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
jwt.refresh-token.expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
jwt.refresh-token.absolute-max-days=${JWT_REFRESH_TOKEN_ABSOLUTE_MAX_DAYS:90}
security.client.approved-ids=${SECURITY_CLIENT_APPROVED_IDS:web-client,mobile-client,notification-service,discount-loyalty-service,booking-service,tracking-service,api-gateway,operator-operations-service,reporting-service,admin-console-service,admin-operator-service}
security.service-clients.clients.notification-service.secret=${SERVICE_CLIENT_NOTIFICATION_SECRET}
security.service-clients.clients.notification-service.authorities=SERVICE_USER_READ
security.service-clients.clients.discount-loyalty-service.secret=${SERVICE_CLIENT_DISCOUNT_LOYALTY_SECRET}
security.service-clients.clients.discount-loyalty-service.authorities=SERVICE_USER_READ
security.service-clients.clients.booking-service.secret=${SERVICE_CLIENT_BOOKING_SECRET}
security.service-clients.clients.booking-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ,SERVICE_PAYMENT_READ
security.service-clients.clients.tracking-service.secret=${SERVICE_CLIENT_TRACKING_SECRET}
security.service-clients.clients.tracking-service.authorities=SERVICE_FLEET_READ
security.service-clients.clients.reporting-service.secret=${SERVICE_CLIENT_REPORTING_SECRET:}
security.service-clients.clients.reporting-service.authorities=SERVICE_FLEET_READ,SERVICE_PAYMENT_READ
security.service-clients.clients.operator-operations-service.secret=${SERVICE_CLIENT_OPERATOR_OPERATIONS_SECRET:}
security.service-clients.clients.operator-operations-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ
security.service-clients.clients.operator-operations-service.roles=SERVICE
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=OFF
management.health.redis.enabled=true
management.endpoint.health.show-details=never
