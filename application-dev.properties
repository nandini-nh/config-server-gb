# =====================================================================
# application-dev.properties
# =====================================================================

# ---------------------------------------------------------------------
# SERVICE REGISTRY
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ---------------------------------------------------------------------
# LOCAL INFRASTRUCTURE
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------
# LOGGING - verbose, for local debugging only
# ---------------------------------------------------------------------
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------
# MYSQL - this service's own local database. Never share with another service.
# ---------------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
security.client.approved-ids=api-gateway,user-service,web-client,mobile-client,notification-service,discount-loyalty-service,booking-service,tracking-service,operator-operations-service,reporting-service,admin-console-service,admin-operator-service

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ==========================================
# SHARED MYSQL DATABASE - DEVELOPMENT
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/greatbus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
