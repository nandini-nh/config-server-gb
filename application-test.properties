# 
# TEST PROFILE
# 

spring.application.name=user-service

# Disable Config Server
spring.cloud.config.enabled=false
spring.config.import=

# Disable Eureka
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# 
# H2 DATABASE
# 

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 
# JPA
# 

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 
# FLYWAY
# 

# Off for the H2 unit-test profile only. V6 puts two ADD COLUMN clauses in one
# ALTER TABLE, which MySQL accepts and H2 does not, so Flyway cannot replay the
# history here. The schema for these tests comes from the JPA entities via
# ddl-auto=create-drop above. dev and prod still run Flyway normally.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# 
# REDIS
# 

spring.data.redis.host=localhost
spring.data.redis.port=6379

# 
# KAFKA
# 

spring.kafka.bootstrap-servers=localhost:9092

# 
# SECURITY
# 

security.client.approved-ids=test-client,api-gateway,notification-service,discount-loyalty-service
security.service-clients.clients.notification-service.secret=test-notification-service-secret
security.service-clients.clients.notification-service.authorities=SERVICE_USER_READ
security.service-clients.clients.discount-loyalty-service.secret=test-discount-loyalty-service-secret
security.service-clients.clients.discount-loyalty-service.authorities=SERVICE_USER_READ

# 
# RATE LIMIT
# 

app.rate-limit.enabled=false

# 
# MAIL
# 

management.health.mail.enabled=false

# 
# TRACING
# 

management.tracing.enabled=false