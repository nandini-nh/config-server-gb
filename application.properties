#---
spring.config.activate.on-profile=notification-service

# =====================================================================
# ACTUATOR
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =====================================================================
# LOGGING (console pattern with correlationId - matches CorrelationIdFilter)
# =====================================================================
logging.level.org.springframework=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n

# =====================================================================
# KAFKA - serializers (common) + this service's own consumer group/trusted packages
# =====================================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.enterprise.notification.messaging,com.enterprise.notification.entity

# =====================================================================
# JPA / FLYWAY
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================================
# WEBHOOK (secret used to verify inbound provider callbacks)
# =====================================================================
webhook.provider-secret=${WEBHOOK_PROVIDER_SECRET}

# =====================================================================
# PROVIDER ROUTING (with failover)
# =====================================================================
notification.provider.email[0]=emailProvider
notification.provider.sms[0]=smsProvider
notification.provider.sms[1]=smsBackupProvider
notification.provider.push[0]=pushProvider
notification.provider.whatsapp[0]=whatsappProvider
notification.provider.whatsapp[1]=whatsappBackupProvider

# =====================================================================
# SMTP / EMAIL
# =====================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================================
# TWILIO (SMS / WhatsApp)
# =====================================================================
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

twilio.whatsapp.from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.whatsapp.sandbox-content-sid=${TWILIO_WHATSAPP_SANDBOX_SID}

# =====================================================================
# FIREBASE (PUSH)
# =====================================================================
firebase.service-account.path=classpath:firebase-service-account.json
firebase.enabled=${FIREBASE_ENABLED:true}

# =====================================================================
# SECURITY (JWT) - RS256 + JWKS
# =====================================================================
jwt.jwks-uri=${JWT_JWKS_URI}
jwt.issuer=${JWT_ISSUER:GB-user-service}
jwt.audiences=${JWT_AUDIENCES:notification-service,greatbus-api}

# --- PROMO_ACTIVATED bulk fan-out (see PromoActivatedConsumer) ---
# Same user-service base URL discount-loyalty-service already points at
# for its own (single-user) Feign client - this service's client just
# calls a paginated variant of the same /api/v1/admin/users endpoint.
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
# Item 4 (proper fix): this service's secret for user-service's
# POST /internal/oauth/token, matching user-service's
# security.service-clients.clients.notification-service.secret. When set,
# ServiceTokenProvider exchanges it for a short-lived JWT and refreshes it
# automatically - user-service.service-token below is then ignored.
user-service.service-secret=${SERVICE_CLIENT_NOTIFICATION_SECRET:CHANGE_ME_NOTIFICATION_SERVICE_SECRET}
# Legacy static service-to-service credential sent as "Authorization: Bearer
# \<token>" on every call UserServiceFeignClient makes (see
# UserServiceFeignConfig). Kept only as a fallback for as long as
# user-service.service-secret above is not set; left blank only for
# local/dev convenience, in which case a warning is logged and the call
# goes out unauthenticated.
user-service.service-token=${USER_SERVICE_SERVICE_TOKEN:}
# Sent as X-Client-ID on the same calls. user-service's ClientIdValidationFilter
# runs BEFORE its JWT filter and rejects /api/v1/admin/\*\* without an approved
# client id with 400 USR-400-001, so the Authorization header alone was never
# enough. This value must also appear in user-service's
# security.client.approved-ids list.
user-service.client-id=${USER_SERVICE_CLIENT_ID:notification-service}
# Users resolved/notified per page of the eligible-user pagination. Keeps
# each page bounded and restartable instead of loading the whole 50,000+
# audience into memory or one Kafka message at once.
notification.bulk.batch-size=${NOTIFICATION_BULK_BATCH_SIZE:1000}
# Safety cap on pages processed per campaign poll, purely to bound a
# runaway loop if user-service ever returns "last=false" forever; not
# expected to be hit in normal operation.
notification.bulk.max-pages-per-campaign=${NOTIFICATION_BULK_MAX_PAGES_PER_CAMPAIGN:1000}
# How long a campaign can sit in IN_PROGRESS with no update before
# PromoCampaignRecoveryScheduler treats it as stalled (e.g. paused after
# hitting max-pages-per-campaign, or abandoned after a crash) and resumes
# it from lastProcessedPage + 1.
notification.bulk.stale-campaign-threshold-minutes=${NOTIFICATION_BULK_STALE_CAMPAIGN_THRESHOLD_MINUTES:15}
# How often PromoCampaignRecoveryScheduler polls for stalled campaigns.
notification.bulk.recovery-poll-interval-ms=${NOTIFICATION_BULK_RECOVERY_POLL_INTERVAL_MS:60000}
# Geofence alerts go to the operator; set this to also copy a platform address.
notification.alerts.platform-email=${NOTIFICATION_PLATFORM_ALERT_EMAIL:}
notification.alerts.geofence-topic=${NOTIFICATION_GEOFENCE_TOPIC:tracking.geofence.event}
# =====================================================================

#---
spring.config.activate.on-profile=operator-operations-service

# ---- Config server / Eureka (same conventions as admin-operator-service) ----
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---- MySQL (LLD s7: database operator_operations_core). No default password on purpose. ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operator_operations_core?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT resource server (validates tokens issued by user-service; issues none) ----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_JWKS_URI:${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}}
security.jwt.issuer=${JWT_ISSUER:GB-user-service}
security.jwt.audience=${JWT_AUDIENCE:greatbus-api}

# ---- Redis (LLD s8) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}

# ---- Kafka producer (same settings as admin-operator-service: idempotent, acks=all) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}

# ---- Kafka consumer (Phase 3A step 3: operator.activated / operator.suspended -> operator_parent_status, D-7) ----
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:operator-operations-service}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
operator.parent-status.consumer-enabled=${OPERATOR_STATUS_CONSUMER_ENABLED:true}

# ---- Outbox relay (LLD s5.2 / s21.1: OUTBOX_RETRY_BASE_SECONDS=2, OUTBOX_RETRY_MAX_SECONDS=300) ----
operator.outbox.enabled=${OUTBOX_ENABLED:true}
operator.outbox.poll-ms=${OUTBOX_POLL_MS:1000}
operator.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
operator.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
operator.outbox.retry-base=${OUTBOX_RETRY_BASE_SECONDS:2}s
operator.outbox.retry-max=${OUTBOX_RETRY_MAX_SECONDS:300}s
operator.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT_MS:10000}ms

# ---- Downstream services (LLD s21.1). Foundation only: no business calls in Phase 1. ----
operator.clients.user-service-url=${USER_SERVICE_URL:http://localhost:8081}
operator.clients.admin-operator-service-url=${ADMIN_OPERATOR_SERVICE_URL:http://localhost:8088}
operator.clients.fleet-service-url=${FLEET_SERVICE_URL:http://localhost:8082}
operator.clients.booking-service-url=${BOOKING_SERVICE_URL:http://localhost:8083}
operator.clients.payment-service-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
operator.clients.tracking-service-url=${TRACKING_SERVICE_URL:http://localhost:8089}
operator.clients.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}
operator.clients.reporting-service-url=${REPORTING_SERVICE_URL:http://localhost:8086}
operator.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
operator.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:5s}

# Service-to-service credential exchange with user-service (POST /internal/oauth/token).
# The secret is optional at startup; without it downstream calls simply carry no bearer token.
operator.service-auth.client-id=${OPERATOR_SERVICE_CLIENT_ID:operator-operations-service}
operator.service-auth.service-secret=${OPERATOR_SERVICE_SECRET:}

# ---- Object storage (S3/MinIO, LLD s16 / s21.1). Used by presigned document upload (Phase 2C, AWS SDK v2). ----
operator.storage.endpoint=${STORAGE_S3_ENDPOINT:}
operator.storage.bucket=${STORAGE_S3_BUCKET:gb-platform-dev}
operator.storage.region=${STORAGE_S3_REGION:us-east-1}
operator.storage.access-key=${STORAGE_S3_ACCESS_KEY:}
operator.storage.secret-key=${STORAGE_S3_SECRET_KEY:}
operator.storage.path-style=${STORAGE_S3_PATH_STYLE:true}
operator.storage.document-max-bytes=${DOCUMENT_MAX_BYTES:5242880}
operator.storage.presigned-minutes=${DOCUMENT_PRESIGNED_MINUTES:5}

# ---- Document number protection (LLD s16). Base64 of 32 random bytes; supplied by the environment, never committed.
# Empty = fail closed: document numbers cannot be stored (503) until a key is configured.
operator.documents.encryption-key=${DOCUMENT_ENCRYPTION_KEY:}

# ---- JSON binding ----
# Reject request bodies that carry properties the API does not define (e.g. status, driverUuid, rating),
# instead of silently ignoring them. Protects server-controlled and immutable fields from mass assignment.
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- Actuator (same shape as tracking-service; /actuator is not routed by the gateway) ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ---- Logging: correlationId comes from MDC (CorrelationIdFilter) ----
logging.level.root=INFO
logging.level.com.enterprise.operatorops=INFO
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]

# ---- Phase 6 step 1: inbound consumers (LLD s11.1) and poison-message handling ----
# Consumers for operator.staff.\* / fleet.\* / schedule.updated / route.updated (operator.activated/suspended: see above).
operator.inbound.consumer-enabled=${OPERATOR_INBOUND_CONSUMER_ENABLED:true}
# Retry with exponential backoff, then dead-letter to "\<topic>.DLT". The LLD names no values (decision D6-7).
operator.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_MS:1000}
operator.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
operator.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:30000}
operator.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:5}
operator.kafka.dlt-suffix=${KAFKA_DLT_SUFFIX:.DLT}

# ---- Rate limit (Phase 6 step 3; LLD s8 key operator:rate:{driverUuid}:{action}; numbers are NOT in the LLD: owner confirms) ----
operator.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
operator.rate-limit.document-upload.max=${RATE_LIMIT_DOCUMENT_UPLOAD_MAX:20}
operator.rate-limit.document-upload.window=${RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW:1h}
operator.rate-limit.trip-command.max=${RATE_LIMIT_TRIP_COMMAND_MAX:30}
operator.rate-limit.trip-command.window=${RATE_LIMIT_TRIP_COMMAND_WINDOW:1m}
operator.rate-limit.payout-account-write.max=${RATE_LIMIT_PAYOUT_WRITE_MAX:5}
operator.rate-limit.payout-account-write.window=${RATE_LIMIT_PAYOUT_WRITE_WINDOW:1h}

# Phase 6 step 5: outbox hardening + housekeeping (defaults are DECISIONS NEEDED: LLD gives no numbers)
operator.outbox.batch-failure-limit=${OUTBOX_BATCH_FAILURE_LIMIT:3}
operator.outbox.cleanup.enabled=${OUTBOX_CLEANUP_ENABLED:true}
operator.outbox.cleanup.retention-days=${OUTBOX_CLEANUP_RETENTION_DAYS:14}
operator.outbox.cleanup.batch-limit=${OUTBOX_CLEANUP_BATCH_LIMIT:500}
operator.outbox.cleanup.interval-ms=${OUTBOX_CLEANUP_INTERVAL_MS:3600000}
operator.idempotency.cleanup.enabled=${IDEMPOTENCY_CLEANUP_ENABLED:true}
operator.idempotency.cleanup.batch-limit=${IDEMPOTENCY_CLEANUP_BATCH_LIMIT:500}
operator.idempotency.cleanup.interval-ms=${IDEMPOTENCY_CLEANUP_INTERVAL_MS:3600000}
operator.housekeeping.max-batches-per-run=${HOUSEKEEPING_MAX_BATCHES_PER_RUN:20}

#---
spring.config.activate.on-profile=payment-refund-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment_core}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Without this, Hibernate 6's default UUID<->JDBC mapping writes UUID columns as raw
# BINARY(16) bytes, which fails MySQL's utf8mb4 string validation against the CHAR(36)
# columns used here (id, user_id, payment_id, refund_id) - force the CHAR representation
# to match what's actually in the schema.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 8081 now belongs to the api-gateway, so this service moved to 8084.
server.servlet.context-path=/api/v1

spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2

payment.redis.address=redis\://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

payment.security.webhook.secret=${WEBHOOK_SECRET}
# Which gateway the money actually goes through. It stays on the stub until the
# Razorpay keys arrive; then PAYMENT_GATEWAY=razorpay plus the three values
# below, and nothing in the code changes. The service refuses to start on
# razorpay unless all three are set, so it can never run half-configured.
payment.gateway.provider=${PAYMENT_GATEWAY:stub}
payment.gateway.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.gateway.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.gateway.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payment.gateway.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}

management.health.redis.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

payment.kafka.topic.payment-intent-created=payment.intent.created
payment.kafka.topic.payment-succeeded=payment.succeeded
payment.kafka.topic.payment-failed=payment.failed
payment.kafka.topic.refund-initiated=refund.initiated
payment.kafka.topic.refund-completed=refund.completed
payment.kafka.topic.refund-failed=refund.failed
payment.kafka.topic.refund-requested=refund.requested
payment.kafka.topic.partial-refund-issued=refund.partial.issued
payment.kafka.topic.refund-policy-applied=refund.policy.applied
payment.kafka.topic.payment-pending=payment.pending
payment.kafka.topic.payment-timeout=payment.timeout
payment.kafka.topic.duplicate-payment-detected=payment.duplicate.detected

payment.kafka.relay.interval-ms=5000
payment.kafka.relay.batch-size=200
payment.kafka.relay.max-attempts=5

spring.jackson.generator.write-bigdecimal-as-plain=true

logging.level.com.enterprise.payment=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# ===========================================================================
# PLATFORM INTEGRATION - service discovery and centralised configuration
#
# Coordinates match the shared infrastructure:
#   eureka-server  8761      config-server  8888      api-gateway  8081
#
# "optional:" is deliberate. notification-service omits it so it hard-fails
# when config-server is down, but booking/payment are also run standalone for
# local development and QA, where no config server exists. Optional keeps both
# modes working; set CONFIG_SERVER_REQUIRED=true (drops the prefix) in any
# environment where starting without central config must be a startup failure.
# ===========================================================================

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# This service no longer validates JWTs - identity and access are owned by the
# user service and enforced at the api-gateway, which forwards the caller's id
# in the X-User-Id header. The former payment.security.jwt.\* settings were removed
# because nothing read them and they wrongly implied HS256 validation here.

# Reject bodies carrying fields the DTO does not declare. Silently ignoring them hides
# client mistakes - a misspelled "amount" would look like a successful intent.
spring.jackson.deserialization.fail-on-unknown-properties=true

# discount-loyalty-service, for applying + confirming a coupon at payment-intent time.
# It requires a real user JWT (it validates tokens issued by user-service) plus
# X-Client-ID/X-Correlation-ID, so a coupon can only be applied when the caller's
# Authorization header reached this service and is forwarded as-is here - this service
# does not mint or validate the token itself.
payment.discount-service.base-url=${DISCOUNT_SERVICE_BASE_URL:http://localhost:8085/api/v1}
payment.discount-service.client-id=${DISCOUNT_SERVICE_CLIENT_ID:payment-refund-service}

# Callers are authenticated against user-service's JWKS. Same issuer and audience as
# every other service in the platform; the port is user-service's, not the gateway's.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
