server.forward-headers-strategy=framework

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.table=user_service_flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true


# Jackson
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=user-service

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json
server.compression.min-response-size=2KB

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Graceful shutdown
spring.lifecycle.timeout-per-shutdown-phase=30s

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Retry
resilience4j.retry.instances.redisRetry.max-attempts=3
resilience4j.retry.instances.redisRetry.wait-duration=500ms

# Circuit breaker
resilience4j.circuitbreaker.instances.redisCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisCircuitBreaker.wait-duration-in-open-state=30s

# Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# HTTP metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Client security
security.client.approved-ids=api-gateway,user-service,notification-service,discount-loyalty-service,booking-service,tracking-service,operator-operations-service,reporting-service,admin-console-service,admin-operator-service

# Rate limiting
app.rate-limit.enabled=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka consumer
spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Account-deletion outbox relay
account-deletion.outbox.relay.fixed-delay-ms=5000
account-deletion.outbox.relay.batch-size=50
account-deletion.outbox.relay.publish-timeout-seconds=5

# JWT
jwt.key-id=${JWT_KEY_ID:gb-user-key-001}
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/public.pem}
jwt.issuer=${JWT_ISSUER:GB-user-service}
jwt.audience=${JWT_AUDIENCE:greatbus-api}
jwt.access-token.expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
jwt.refresh-token.expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
jwt.refresh-token.absolute-max-days=${JWT_REFRESH_TOKEN_ABSOLUTE_MAX_DAYS:90}

# Admin user listing
app.admin.users.default-page-size=1000
app.admin.users.max-page-size=5000

# Service clients
security.service-clients.clients.notification-service.secret=${SERVICE_CLIENT_NOTIFICATION_SECRET}
security.service-clients.clients.notification-service.authorities=SERVICE_USER_READ

security.service-clients.clients.discount-loyalty-service.secret=${SERVICE_CLIENT_DISCOUNT_LOYALTY_SECRET}
security.service-clients.clients.discount-loyalty-service.authorities=SERVICE_USER_READ

security.service-clients.clients.booking-service.secret=${SERVICE_CLIENT_BOOKING_SECRET}
security.service-clients.clients.booking-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ,SERVICE_PAYMENT_READ,SERVICE_REFUND_WRITE

security.service-clients.clients.tracking-service.secret=${SERVICE_CLIENT_TRACKING_SECRET}
security.service-clients.clients.tracking-service.authorities=SERVICE_FLEET_READ

security.service-clients.clients.reporting-service.secret=${SERVICE_CLIENT_REPORTING_SECRET}
security.service-clients.clients.reporting-service.authorities=SERVICE_FLEET_READ,SERVICE_PAYMENT_READ

security.service-clients.clients.operator-operations-service.secret=${SERVICE_CLIENT_OPERATOR_OPERATIONS_SECRET:}
security.service-clients.clients.operator-operations-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ
security.service-clients.clients.operator-operations-service.roles=SERVICE

security.service-clients.clients.shipment-service.secret=${SERVICE_CLIENT_SHIPMENT_SECRET:}
security.service-clients.clients.shipment-service.authorities=SERVICE_REFUND_WRITE

security.service-clients.clients.admin-console-service.secret=${SERVICE_CLIENT_ADMIN_CONSOLE_SECRET:}
security.service-clients.clients.admin-console-service.authorities=SERVICE_ADMIN_CONSOLE_READ

security.service-clients.clients.admin-operator-service.secret=${SERVICE_CLIENT_ADMIN_OPERATOR_SECRET:}
security.service-clients.clients.admin-operator-service.authorities=SERVICE_STAFF_INVITE

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@localhost}}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Google Sign-In
google.client-id=${GOOGLE_CLIENT_ID:976774472403-alng2t068jr3g7lv4a0aeqnn3as6tb88.apps.googleusercontent.com}

# Microsoft Sign-In
microsoft.client-id=${MICROSOFT_CLIENT_ID:}

# Bootstrap admin credentials
admin.credentials.username=${ADMIN_USERNAME}
admin.credentials.password=${ADMIN_PASSWORD}
admin.credentials.role=${ADMIN_ROLE}
admin.credentials.reset-on-start=${ADMIN_RESET_ON_START:false}

# Object storage
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.profile-photo-prefix=${STORAGE_S3_PROFILE_PHOTO_PREFIX:profile-photos}
storage.s3.region=${AWS_REGION:ap-south-1}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE:false}
storage.s3.kms-key-id=${STORAGE_S3_KMS_KEY_ID:}
storage.s3.presigned-url-minutes=${STORAGE_S3_PRESIGNED_URL_MINUTES:15}
storage.s3.max-photo-bytes=${STORAGE_S3_MAX_PHOTO_BYTES:5242880}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:6MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:6MB}

# Two-step verification
notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}
two-factor.code-expiry-minutes=${TWO_FACTOR_CODE_EXPIRY_MINUTES:5}
two-factor.max-codes-per-hour=${TWO_FACTOR_MAX_CODES_PER_HOUR:10}
two-factor.delivery.enabled=${TWO_FACTOR_DELIVERY_ENABLED:true}

//dev Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR


#---
//Notification-Service
spring.config.activate.on-profile=notification-service

# Notification Service - JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Notification Service - Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=notification_flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-version=1

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n

# Kafka - Notification Service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.enterprise.notification.messaging,com.enterprise.notification.entity

# Webhook
webhook.provider-secret=${WEBHOOK_PROVIDER_SECRET}

# Provider routing
notification.provider.email[0]=emailProvider
notification.provider.sms[0]=smsProvider
notification.provider.sms[1]=smsBackupProvider
notification.provider.push[0]=pushProvider
notification.provider.whatsapp[0]=whatsappProvider
notification.provider.whatsapp[1]=whatsappBackupProvider

# Email / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp.from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.whatsapp.sandbox-content-sid=${TWILIO_WHATSAPP_SANDBOX_SID:}

# Firebase
firebase.service-account.path=classpath:firebase-service-account.json
firebase.enabled=${FIREBASE_ENABLED:true}

# JWT / JWKS
jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
jwt.issuer=${JWT_ISSUER:GB-user-service}
jwt.audiences=${JWT_AUDIENCES:notification-service,greatbus-api}

# User Service integration
user-service.url=${USER_SERVICE_URL:http://localhost:8081}
user-service.service-secret=${SERVICE_CLIENT_NOTIFICATION_SECRET:}
user-service.service-token=${USER_SERVICE_SERVICE_TOKEN:}
user-service.client-id=${USER_SERVICE_CLIENT_ID:notification-service}

# Bulk notifications
notification.bulk.batch-size=${NOTIFICATION_BULK_BATCH_SIZE:1000}
notification.bulk.max-pages-per-campaign=${NOTIFICATION_BULK_MAX_PAGES_PER_CAMPAIGN:1000}
notification.bulk.stale-campaign-threshold-minutes=${NOTIFICATION_BULK_STALE_CAMPAIGN_THRESHOLD_MINUTES:15}
notification.bulk.recovery-poll-interval-ms=${NOTIFICATION_BULK_RECOVERY_POLL_INTERVAL_MS:60000}

# Alerts
notification.alerts.platform-email=${NOTIFICATION_PLATFORM_ALERT_EMAIL:}
notification.alerts.geofence-topic=${NOTIFICATION_GEOFENCE_TOPIC:tracking.geofence.event}


