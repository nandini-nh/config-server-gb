operator.clients.fleet-service-url=${FLEET_SERVICE_URL:http://localhost:8082}
operator.clients.booking-service-url=${BOOKING_SERVICE_URL:http://localhost:8083}
operator.clients.payment-service-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
operator.clients.tracking-service-url=${TRACKING_SERVICE_URL:http://localhost:8089}
operator.clients.notification-service-url=${NOTIFICATION_SERVICE_URL:http://localhost:8087}
operator.clients.reporting-service-url=${REPORTING_SERVICE_URL:http://localhost:8086}
operator.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
operator.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:5s}

# Service-to-service authentication
operator.service-auth.client-id=${OPERATOR_SERVICE_CLIENT_ID:operator-operations-service}
operator.service-auth.service-secret=${OPERATOR_SERVICE_SECRET:}

# Object storage
operator.storage.endpoint=${STORAGE_S3_ENDPOINT:}
operator.storage.bucket=${STORAGE_S3_BUCKET:gb-platform-dev}
operator.storage.region=${STORAGE_S3_REGION:us-east-1}
operator.storage.access-key=${STORAGE_S3_ACCESS_KEY:}
operator.storage.secret-key=${STORAGE_S3_SECRET_KEY:}
operator.storage.path-style=${STORAGE_S3_PATH_STYLE:true}
operator.storage.document-max-bytes=${DOCUMENT_MAX_BYTES:5242880}
operator.storage.presigned-minutes=${DOCUMENT_PRESIGNED_MINUTES:5}

# Document encryption
operator.documents.encryption-key=${DOCUMENT_ENCRYPTION_KEY:}

# Rate limiting
operator.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
operator.rate-limit.document-upload.max=${RATE_LIMIT_DOCUMENT_UPLOAD_MAX:20}
operator.rate-limit.document-upload.window=${RATE_LIMIT_DOCUMENT_UPLOAD_WINDOW:1h}
operator.rate-limit.trip-command.max=${RATE_LIMIT_TRIP_COMMAND_MAX:30}
operator.rate-limit.trip-command.window=${RATE_LIMIT_TRIP_COMMAND_WINDOW:1m}
operator.rate-limit.payout-account-write.max=${RATE_LIMIT_PAYOUT_WRITE_MAX:5}
operator.rate-limit.payout-account-write.window=${RATE_LIMIT_PAYOUT_WRITE_WINDOW:1h}

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.enterprise.operatorops=INFO
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]

