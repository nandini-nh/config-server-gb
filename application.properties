tracking.events.schema-version=1.0

tracking.security.public-position-read=${PUBLIC_POSITION_READ:true}

tracking.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
tracking.user-service.client-id=${USER_SERVICE_CLIENT_ID:tracking-service}
tracking.user-service.service-secret=${SERVICE_CLIENT_TRACKING_SECRET:CHANGE_ME_TRACKING_SERVICE_SECRET}
tracking.user-service.connect-timeout=PT2S
tracking.user-service.read-timeout=PT3S

tracking.fleet.base-url=${FLEET_SERVICE_URL:http://localhost:8082}
tracking.fleet.service-token=${FLEET_SERVICE_TOKEN:}
tracking.fleet.client-id=${FLEET_CLIENT_ID:tracking-service}
tracking.fleet.cache-ttl=PT15M
tracking.fleet.connect-timeout=PT2S
tracking.fleet.read-timeout=PT3S

tracking.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# =========================================================
# NOTIFICATION SERVICE
# =========================================================

logging.level.org.springframework=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.properties.spring.json.trusted.packages=com.enterprise.notification.messaging,com.enterprise.notification.entity

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

webhook.provider-secret=${WEBHOOK_PROVIDER_SECRET}

notification.provider.email[0]=emailProvider
notification.provider.sms[0]=smsProvider
notification.provider.sms[1]=smsBackupProvider
notification.provider.push[0]=pushProvider
notification.provider.whatsapp[0]=whatsappProvider
notification.provider.whatsapp[1]=whatsappBackupProvider

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp.from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.whatsapp.sandbox-content-sid=${TWILIO_WHATSAPP_SANDBOX_SID}

firebase.service-account.path=classpath:firebase-service-account.json
firebase.enabled=${FIREBASE_ENABLED:true}

jwt.jwks-uri=${JWT_JWKS_URI}
jwt.issuer=${JWT_ISSUER:GB-user-service}
jwt.audiences=${JWT_AUDIENCES:notification-service,greatbus-api}

user-service.service-secret=${SERVICE_CLIENT_NOTIFICATION_SECRET:CHANGE_ME_NOTIFICATION_SERVICE_SECRET}
user-service.service-token=${USER_SERVICE_SERVICE_TOKEN:}
user-service.client-id=${USER_SERVICE_CLIENT_ID:notification-service}

notification.bulk.batch-size=${NOTIFICATION_BULK_BATCH_SIZE:1000}
notification.bulk.max-pages-per-campaign=${NOTIFICATION_BULK_MAX_PAGES_PER_CAMPAIGN:1000}
notification.bulk.stale-campaign-threshold-minutes=${NOTIFICATION_BULK_STALE_CAMPAIGN_THRESHOLD_MINUTES:15}
notification.bulk.recovery-poll-interval-ms=${NOTIFICATION_BULK_RECOVERY_POLL_INTERVAL_MS:60000}
notification.alerts.platform-email=${NOTIFICATION_PLATFORM_ALERT_EMAIL:}
notification.alerts.geofence-topic=${NOTIFICATION_GEOFENCE_TOPIC:tracking.geofence.event}

# =========================================================
# ADMIN OPERATOR SERVICE
# =========================================================

eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.locations=classpath:db/migration

spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}

outbox.poll-ms=${OUTBOX_POLL_MS:1000}
outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
outbox.backoff-base-ms=${OUTBOX_BACKOFF_BASE_MS:1000}
outbox.backoff-max-ms=${OUTBOX_BACKOFF_MAX_MS:300000}
outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:10000}

admin.bootstrap.super-admin-user-uuid=${ADMIN_BOOTSTRAP_SUPER_ADMIN_UUID:}

logging.level.root=INFO
logging.level.com.enterprise.admin=INFO

# =========================================================
# USER SERVICE - COMMON CONFIGURATION
# =========================================================

security.client.approved-ids=api-gateway,user-service,web-client,mobile-client,notification-service,discount-loyalty-service,booking-service,tracking-service

# =========================================================
# SERVICE CLIENT / CONFIG SERVER CONNECTION SETTINGS
# =========================================================

spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# =========================================================
# ENVIRONMENT / OBSERVABILITY
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.shutdown=graceful
