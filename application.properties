# Bootstrap admin user (AdminBootstrap creates it on first start).

# These used to sit in bootstrap.properties, which Spring Boot 3 never reads

# because spring-cloud-starter-bootstrap is not on the classpath - so the

# values were always null and AdminBootstrap would fail on startup.

# =========================================================

# email / password .env (server lo secrets) nunchi matrame - code lo default ledu. ivvakapothe admin create avvadu

admin.credentials.username=${ADMIN_USERNAME:}

admin.credentials.password=${ADMIN_PASSWORD:}

admin.credentials.display-name=${ADMIN_NAME:Super Admin}

admin.credentials.role=${ADMIN_ROLE:ADMIN}

# password marchipoyi admin login avvalekapothe true pettandi - start lo password / lock reset avutundi

admin.credentials.reset-on-start=${ADMIN_RESET_ON_START:false}

# =====================================================================

# OBJECT STORAGE (profile photos)

# The photo is kept in S3, never on the machine that served the upload, so

# every instance can hand out a link for it. Point endpoint/path-style at a

# local MinIO for development; leave them empty for real AWS. Credentials come

# from the standard AWS chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY or an

# instance role) - no keys belong in this file.

# =====================================================================

storage.s3.bucket=${STORAGE_S3_BUCKET:}

storage.s3.profile-photo-prefix=${STORAGE_S3_PROFILE_PHOTO_PREFIX:profile-photos}

storage.s3.region=${AWS_REGION:ap-south-1}

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE:false}

storage.s3.kms-key-id=${STORAGE_S3_KMS_KEY_ID:}

storage.s3.presigned-url-minutes=${STORAGE_S3_PRESIGNED_URL_MINUTES:15}

storage.s3.max-photo-bytes=${STORAGE_S3_MAX_PHOTO_BYTES:5242880}

# Multipart limits for the photo upload endpoint; slightly above the photo

# limit above so the service answers with its own clear message.

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:6MB}

spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:6MB}

# =====================================================================

# TWO-STEP VERIFICATION

# Codes are delivered by notification-service through its existing dispatch

# API (templates live in that service's own migration).

# =====================================================================

notification-service.url=${NOTIFICATION_SERVICE_URL:http\://localhost:8087}

two-factor.code-expiry-minutes=${TWO_FACTOR_CODE_EXPIRY_MINUTES:5}

two-factor.max-codes-per-hour=${TWO_FACTOR_MAX_CODES_PER_HOUR:10}

two-factor.delivery.enabled=${TWO_FACTOR_DELIVERY_ENABLED:true}
