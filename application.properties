
# =========================================================
# COMMON EUREKA CONFIGURATION
# =========================================================

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# COMMON KAFKA CONFIGURATION
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# =========================================================
# COMMON JWT CONFIGURATION
# =========================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:greatbus-api}

security.jwt.jwk-set-uri=${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
security.jwt.issuer=${JWT_ISSUER:GB-user-service}
security.jwt.audience=${JWT_AUDIENCE:greatbus-api}

# =========================================================
# COMMON REDIS CONFIGURATION
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

