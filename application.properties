server.servlet.encoding.charset=UTF-8

server.servlet.encoding.enabled=true

server.servlet.encoding.force=true

# Graceful Shutdown

spring.lifecycle.timeout-per-shutdown-phase=30s

# CORS

cors.allowed-origins=http\://localhost:3000,http\://localhost:5173

cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

cors.allowed-headers=\*

cors.allow-credentials=true

# Retry

resilience4j.retry.instances.redisRetry.max-attempts=3

resilience4j.retry.instances.redisRetry.wait-duration=500ms

# Circuit Breaker

resilience4j.circuitbreaker.instances.redisCircuitBreaker.sliding-window-size=10

resilience4j.circuitbreaker.instances.redisCircuitBreaker.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.redisCircuitBreaker.wait-duration-in-open-state=30s

management.tracing.enabled=true

management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http\://localhost:4318/v1/traces

management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Client Security

security.client.approved-ids=api-gateway,user-service,notification-service,discount-loyalty-service,booking-service,tracking-service,operator-operations-service,reporting-service,admin-console-service,admin-operator-service

# modif to true this before production

app.rate-limit.enabled=true

# Redis Configuration

spring.data.redis.host=localhost

spring.data.redis.port=6379

# Kafka Configuration

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=user-service

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer config, required to publish account.deletion.requested (self-delete

# orchestration). No producer was previously configured in this service - only

# consumers existed.

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Account-deletion outbox relay (durable, retryable publication of

# account.deletion.requested - see AccountDeletionOutboxRelay).

account-deletion.outbox.relay.fixed-delay-ms=5000

account-deletion.outbox.relay.batch-size=50

account-deletion.outbox.relay.publish-timeout-seconds=5

# =========================================================

# JWT

# =========================================================

jwt.key-id=${JWT_KEY_ID:gb-user-key-001}

jwt.private-key=${JWT_PRIVATE_KEY:classpath:keys/private.pem}

jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/public.pem}

jwt.issuer=${JWT_ISSUER:GB-user-service}

jwt.audience=${JWT_AUDIENCE:greatbus-api}

jwt.access-token.expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}

jwt.refresh-token.expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

jwt.refresh-token.absolute-max-days=${JWT_REFRESH_TOKEN_ABSOLUTE_MAX_DAYS:90}

# =========================================================

# Admin user listing (GET /api/v1/admin/users pagination)

# =========================================================

app.admin.users.default-page-size=1000

app.admin.users.max-page-size=5000

# =========================================================

# Service Clients - POST /internal/oauth/token (item 4)

# =========================================================

security.service-clients.clients.notification-service.secret=${SERVICE_CLIENT_NOTIFICATION_SECRET:CHANGE_ME_NOTIFICATION_SERVICE_SECRET}

security.service-clients.clients.notification-service.authorities=SERVICE_USER_READ

security.service-clients.clients.discount-loyalty-service.secret=${SERVICE_CLIENT_DISCOUNT_LOYALTY_SECRET:CHANGE_ME_DISCOUNT_LOYALTY_SERVICE_SECRET}

security.service-clients.clients.discount-loyalty-service.authorities=SERVICE_USER_READ

security.service-clients.clients.booking-service.secret=${SERVICE_CLIENT_BOOKING_SECRET:CHANGE_ME_BOOKING_SERVICE_SECRET}

security.service-clients.clients.booking-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ,SERVICE_PAYMENT_READ

security.service-clients.clients.tracking-service.secret=${SERVICE_CLIENT_TRACKING_SECRET:CHANGE_ME_TRACKING_SERVICE_SECRET}

security.service-clients.clients.tracking-service.authorities=SERVICE_FLEET_READ

security.service-clients.clients.reporting-service.secret=${SERVICE_CLIENT_REPORTING_SECRET:CHANGE_ME_REPORTING_SERVICE_SECRET}

security.service-clients.clients.reporting-service.authorities=SERVICE_FLEET_READ,SERVICE_PAYMENT_READ

security.service-clients.clients.operator-operations-service.secret=${SERVICE_CLIENT_OPERATOR_OPERATIONS_SECRET:}

security.service-clients.clients.operator-operations-service.authorities=SERVICE_USER_READ,SERVICE_FLEET_READ

security.service-clients.clients.operator-operations-service.roles=SERVICE

# admin-console-service (merged from v3): scheduled exports and the public ticket link have no signed-in admin behind them, so the console

# reads booking/payment console views as itself. No secret is committed - the client stays disabled (blank secret is refused)

# until SERVICE_CLIENT_ADMIN_CONSOLE_SECRET is set in the environment.

security.service-clients.clients.admin-console-service.secret=${SERVICE_CLIENT_ADMIN_CONSOLE_SECRET:}

security.service-clients.clients.admin-console-service.authorities=SERVICE_ADMIN_CONSOLE_READ

# admin-operator-service: operator owner staff ni email tho add chesinappudu account vethakadam / invite

security.service-clients.clients.admin-operator-service.secret=${SERVICE_CLIENT_ADMIN_OPERATOR_SECRET:}

security.service-clients.clients.admin-operator-service.authorities=SERVICE_STAFF_INVITE

